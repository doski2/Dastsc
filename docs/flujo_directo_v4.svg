  <text x="72" y="321" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text>
  <rect x="100" y="290" width="760" height="52" rx="6" fill="#fff" stroke="#2c5282" stroke-width="2" filter="url(#shadow)"/>
  <text x="116" y="310" font-size="12" font-weight="600" fill="#2c5282">command_bus directo</text>
  <text x="116" y="326" font-size="10" fill="#4a5568">SendCommand.txt + flag (sin WS COMMAND en objetivo Fase 2)</text>
  <line x1="72" y1="342" x2="72" y2="362" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

