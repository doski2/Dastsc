  <rect x="100" y="356" width="760" height="52" rx="6" fill="#fff" stroke="#4299e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="116" y="376" font-size="12" font-weight="600" fill="#2b6cb0">Lua SendData</text>
  <text x="116" y="392" font-size="10" fill="#4a5568">VirtualBrake / ThrottleAndBrake -&gt; proximo tick paso 1</text>

  <path d="M 72 408 L 72 440 L 40 440 L 40 168 L 72 168" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <rect x="100" y="460" width="760" height="100" rx="6" fill="#edf2f7" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="116" y="484" font-size="11" font-weight="600" fill="#4a5568">Paralelo (no bloquea AUTO)</text>
  <text x="116" y="504" font-size="10" fill="#4a5568">WebSocket -&gt; V4: panel, headline, log sesion (SUGGEST / ARM siguen en UI)</text>
  <text x="116" y="524" font-size="10" fill="#718096">Eliminado del camino caliente: WS TELEMETRY para decidir, TelemetryHub, useAutoCommand (Fase 2)</text>
