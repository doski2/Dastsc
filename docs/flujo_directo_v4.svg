  <rect x="100" y="142" width="760" height="52" rx="6" fill="#fff" stroke="#3182ce" stroke-width="2" filter="url(#shadow)"/>
  <text x="116" y="162" font-size="12" font-weight="600" fill="#2b6cb0">Lua GetData</text>
  <text x="116" y="178" font-size="10" fill="#4a5568">Railworks_GetData_Script.lua -&gt; GetData.txt (~10-20 Hz)</text>
  <line x1="72" y1="194" x2="72" y2="214" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <circle cx="72" cy="234" r="16" fill="#2d3748"/>
  <text x="72" y="239" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
  <rect x="100" y="208" width="760" height="68" rx="6" fill="#fff" stroke="#3182ce" stroke-width="2" filter="url(#shadow)"/>
